[build]
  command = "pnpm run build && pnpm run assemble"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public by nature: it is in the tag every visitor's page carries.
  UMAMI_WEBSITE_ID = "026e2417-e6c3-4a2d-95c5-c26cec91eb3f"

# Usage analytics (Umami Cloud), served from this origin so content blockers
# that list the Umami hosts don't drop it. The prefix must match
# ANALYTICS_PREFIX in vite/analytics-tag.mjs. The tracker posts its events to
# <prefix>/api/send, which is the edge function
# netlify/edge-functions/umami-send.js and not a rewrite: it adds the visitor's
# address, without which Umami locates every visitor at a Netlify node. The tag
# itself is added at assemble time, only when UMAMI_WEBSITE_ID is set under
# [build.environment].
[[redirects]]
  from = "/u/s.js"
  to = "https://cloud.umami.is/script.js"
  status = 200
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
