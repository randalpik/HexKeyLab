<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HKL Instrument Compare</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #16181d; color: #d8dbe2; font: 13px/1.5 system-ui, sans-serif; }
    header { padding: 10px 16px; background: #1d2026; border-bottom: 1px solid #2a2e36;
             display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    header h1 { font-size: 14px; margin: 0 12px 0 0; color: #fff; }
    header label { color: #9aa0ab; }
    select, button { background: #262a32; color: #d8dbe2;
             border: 1px solid #3a4048; border-radius: 4px; padding: 3px 8px; font: inherit; }
    button { cursor: pointer; }
    button:hover { background: #303540; }
    button.playing { background: #2c4a2e; border-color: #4a7a4e; }
    #status { color: #8b93a2; margin-left: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { padding: 4px 8px; text-align: left; vertical-align: top; border-bottom: 1px solid #23262d; }
    th { position: sticky; top: 0; background: #1d2026; color: #9aa0ab; font-weight: 500; z-index: 2; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .side { border-left: 2px solid #2a2e36; }
    .segchip { display: inline-block; margin: 1px 2px; padding: 0 5px; border-radius: 3px;
               font-size: 11px; cursor: pointer; background: #262a32; }
    .segchip.g { color: #7fd08a; border: 1px solid #2f5c36; }
    .segchip.y { color: #d8c56b; border: 1px solid #5c542f; }
    .segchip.r { color: #e08585; border: 1px solid #5c2f2f; }
    .segchip:hover { filter: brightness(1.3); }
    canvas.wave { display: block; background: #101216; border-radius: 3px; }
    .warn { color: #e0a85c; }
    .good { color: #7fd08a; }
    .bad { color: #e08585; }
    #zoomwrap { position: sticky; bottom: 0; background: #1d2026; border-top: 1px solid #2a2e36;
                padding: 6px 16px; display: none; }
    #zoomwrap .cap { color: #9aa0ab; margin-bottom: 4px; }
    .mono { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <h1>Instrument Compare</h1>
    <label>A <select id="selA"></select></label>
    <label>B <select id="selB"></select></label>
    <button id="loadBtn">Load</button>
    <label><input type="checkbox" id="blind" /> blind</label>
    <button id="stopBtn">Stop (Esc)</button>
    <span id="status">pick two builds</span>
  </header>
  <div id="tablewrap"></div>
  <div id="zoomwrap">
    <div class="cap" id="zoomcap"></div>
    <div style="margin:4px 0; display:flex; gap:10px; align-items:center">
      <button id="soloBtn">Loop this seam</button>
      <span id="soloInfo" class="mono" style="color:#9aa0ab"></span>
      <span id="wrapFlash" style="display:inline-block;width:14px;height:14px;border-radius:7px;background:#2a2e36"></span>
      <span style="color:#6b7280;font-size:11px">flash = wrap moment — a bump AT the flash is modulation-phase (H1); a bump at a fixed position between flashes is an interior event (H2)</span>
    </div>
    <canvas id="zoom" width="1200" height="310"></canvas>
  </div>
  <script type="module" src="/src/compare/main.ts"></script>
</body>
</html>
